<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neovalues Database</title>
    <script src="data.js"></script>
    <style>
        :root {
            color-scheme: dark;
            --background: #111;
            --panel: #191919;
            --border: #303030;
            --text: #eee;
            --muted: #999;
            --accent: #00a0ff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--background);
            color: var(--text);
            font-family: Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        button,
        input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        #app {
            display: grid;
            grid-template-columns: 300px minmax(0, 1fr);
            height: 100vh;
        }

        #sidebar {
            background: var(--panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        #sidebar-header {
            padding: 22px 18px 14px;
            border-bottom: 1px solid var(--border);
        }

        #sidebar-header h2 {
            font-size: 20px;
            margin: 0 0 14px;
        }

        #count {
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 12px;
        }

        #search {
            background: #101010;
            border: 1px solid var(--border);
            border-radius: 5px;
            color: var(--text);
            outline: none;
            padding: 11px;
            width: 100%;
        }

        #search:focus {
            border-color: var(--accent);
        }

        #ideology-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .group-title {
            color: var(--muted);
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
            padding: 15px 10px 6px;
            text-transform: uppercase;
        }

        .ideology-item {
            align-items: center;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 4px;
            color: #ccc;
            display: flex;
            gap: 10px;
            padding: 9px 10px;
            text-align: left;
            width: 100%;
        }

        .ideology-item:hover {
            background: #252525;
        }

        .ideology-item.active {
            background: #292929;
            border-color: #444;
            color: white;
        }

        .color-dot {
            border: 1px solid #ffffff25;
            border-radius: 3px;
            flex-shrink: 0;
            height: 13px;
            width: 13px;
        }

        .item-name {
            font-size: 13px;
            line-height: 1.4;
        }

        #main {
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
            overflow-y: auto;
        }

        #topbar {
            align-items: center;
            border-bottom: 1px solid var(--border);
            color: var(--muted);
            display: flex;
            justify-content: space-between;
            padding: 16px 28px;
            font-size: 12px;
        }

        #position {
            font-variant-numeric: tabular-nums;
        }

        #content {
            display: flex;
            flex: 1;
            flex-direction: column;
            justify-content: center;
            margin: auto;
            max-width: 1050px;
            padding: 48px;
            width: 100%;
        }

        #category {
            color: var(--muted);
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 18px;
            text-transform: uppercase;
        }

        #ideology-name {
            font-size: clamp(32px, 5vw, 64px);
            font-weight: 800;
            letter-spacing: -2px;
            line-height: 1.1;
            margin: 0;
            overflow-wrap: anywhere;
        }

        #color-bar {
            border-radius: 3px;
            height: 5px;
            margin: 28px 0;
            max-width: 180px;
            width: 30%;
        }

        #description {
            color: #c7c7c7;
            font-size: 18px;
            line-height: 1.8;
            max-width: 780px;
            white-space: pre-wrap;
        }

        .section {
            border-top: 1px solid var(--border);
            margin-top: 35px;
            padding-top: 22px;
        }

        .section h3 {
            color: var(--muted);
            font-size: 11px;
            letter-spacing: 1.5px;
            margin: 0 0 14px;
            text-transform: uppercase;
        }

        #mapping-count {
            color: #777;
            font-weight: normal;
            margin-left: 6px;
        }

        #mapping-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .mapping {
            background: #191919;
            border: 1px solid #2c2c2c;
            border-radius: 5px;
            color: #bbb;
            font-family: Consolas, monospace;
            font-size: 12px;
            line-height: 1.8;
            overflow-wrap: anywhere;
            padding: 11px 14px;
        }

        .mapping span {
            color: #777;
            display: block;
            font-family: Arial, sans-serif;
            font-size: 10px;
            margin-bottom: 3px;
            text-transform: uppercase;
        }

        #bottom {
            align-items: center;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 18px 28px;
        }

        .nav-button {
            background: #222;
            border: 1px solid #3a3a3a;
            border-radius: 5px;
            color: white;
            font-size: 14px;
            min-width: 110px;
            padding: 12px 18px;
        }

        .nav-button:hover {
            background: #303030;
            border-color: #555;
        }

        .nav-button:disabled {
            cursor: default;
            opacity: .3;
        }

        #keyboard-hint {
            color: #666;
            font-size: 11px;
        }

        kbd {
            background: #252525;
            border: 1px solid #404040;
            border-radius: 3px;
            padding: 2px 5px;
        }

        #empty {
            color: var(--muted);
            font-size: 13px;
            padding: 15px 10px;
        }

        @media (max-width: 760px) {
            #app {
                grid-template-columns: 190px minmax(0, 1fr);
            }

            #content {
                padding: 30px 22px;
            }

            #ideology-name {
                letter-spacing: -1px;
            }

            #description {
                font-size: 15px;
                line-height: 1.7;
            }

            #topbar,
            #bottom {
                padding: 14px;
            }

            .nav-button {
                min-width: 0;
                padding: 10px;
            }
        }

        @media (max-width: 500px) {
            #app {
                grid-template-columns: 125px minmax(0, 1fr);
            }

            #sidebar-header {
                padding: 14px 9px;
            }

            #sidebar-header h2 {
                font-size: 16px;
            }

            .ideology-item {
                gap: 6px;
                padding: 8px 5px;
            }

            .item-name {
                font-size: 11px;
            }

            #content {
                padding: 24px 15px;
            }

            #ideology-name {
                font-size: 32px;
            }

            #description {
                font-size: 14px;
            }

            #keyboard-hint {
                display: none;
            }
        }

        #value-icon {
            display: block;
            height: 100px;
            margin-top: 10px;
            object-fit: contain;
            object-position: left center;
            width: 100px;
        }

        #value-icon[hidden] {
            display: none;
        }

        .combination-values {
            align-items: center;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .combination-value {
            align-items: center;
            background: #222;
            border: 1px solid #383838;
            border-radius: 4px;
            display: inline-flex;
            gap: 7px;
            padding: 6px 9px;
        }

        .combination-value img {
            height: 22px;
            object-fit: contain;
            width: 22px;
        }

        .combination-value span {
            color: #ccc;
            font-family: Consolas, monospace;
            font-size: 12px;
        }

        .combination-value {
            color: inherit;
            cursor: pointer;
            font: inherit;
            text-align: left;
        }

        .combination-value:hover {
            background: #303030;
            border-color: #555;
        }

        #value-popup[hidden] {
            display: none;
        }

        #value-popup {
            align-items: center;
            display: flex;
            inset: 0;
            justify-content: center;
            padding: 20px;
            position: fixed;
            z-index: 1000;
        }

        #value-popup-backdrop {
            background: #000b;
            inset: 0;
            position: absolute;
        }

        #value-popup-content {
            background: #191919;
            border: 1px solid #404040;
            border-radius: 8px;
            max-height: 85vh;
            max-width: 560px;
            overflow-y: auto;
            padding: 35px;
            position: relative;
            width: 100%;
        }

        #value-popup-close {
            background: transparent;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 28px;
            line-height: 1;
            padding: 5px 10px;
            position: absolute;
            right: 12px;
            top: 12px;
        }

        #value-popup-close:hover {
            color: white;
        }

        #value-popup-category {
            color: #999;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        #value-popup-icon {
            display: block;
            height: 90px;
            margin-bottom: 20px;
            object-fit: contain;
            object-position: left center;
            width: 90px;
        }

        #value-popup-icon[hidden] {
            display: none;
        }

        #value-popup-name {
            font-size: 30px;
            line-height: 1.2;
            margin: 0 0 20px;
            overflow-wrap: anywhere;
        }

        #value-popup-description {
            color: #c7c7c7;
            font-size: 15px;
            line-height: 1.8;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>
    <div id="app">
        <aside id="sidebar">
            <div id="sidebar-header">
                <h2>Ideologies</h2>
                <div id="count"></div>
                <input id="search" type="search" placeholder="Search..." autocomplete="off">
            </div>
            <div id="ideology-list"></div>
        </aside>
        <main id="main">
            <header id="topbar">
                <span>IDEOLOGY DATABASE</span>
                <span id="position"></span>
            </header>
            <article id="content">
                <div id="category"></div>
                <h1 id="ideology-name"></h1>
                <div id="color-bar"></div>
                <img id="value-icon" hidden>
                <div id="description"></div>
                <section class="section">
                    <h3>Combination mappings <span id="mapping-count"></span></h3>
                    <div id="mapping-list"></div>
                </section>
            </article>
            <footer id="bottom">
                <button class="nav-button" id="previous" type="button">← Previous</button>
                <span id="keyboard-hint"><kbd>←</kbd> <kbd>→</kbd> to navigate</span>
                <button class="nav-button" id="next" type="button">Next →</button>
            </footer>
        </main>
        <div id="value-popup" hidden>
            <div id="value-popup-backdrop"></div>
            <div id="value-popup-content" role="dialog" aria-modal="true" aria-labelledby="value-popup-name">
                <button id="value-popup-close" type="button" aria-label="Close popup">×</button>
                <div id="value-popup-category"></div>
                <img id="value-popup-icon" alt="">
                <h2 id="value-popup-name"></h2>
                <div id="value-popup-description"></div>
            </div>
        </div>
    </div>
    <script>
        const allIdeologies = Object.keys(descriptions);
        const categoryOf = {};
        for (const [group, names] of Object.entries(ideologyGroups)) {
            for (const name of names) categoryOf[name] = group;
        }
        for (const name of allIdeologies) {
            if (!categoryOf[name]) categoryOf[name] = 'Values';
        }
        const mappingsOf = {};
        for (const [combination, name] of Object.entries(labelMapping)) {
            (mappingsOf[name] ??= []).push(combination);
        }
        let visibleIdeologies = [...allIdeologies];
        let currentIndex = 0;
        const $ = id => document.getElementById(id);
        const iconPath = value => `./icons/${value}.svg`;
        const list = $('ideology-list');
        const search = $('search');
        function renderList() {
            const query = search.value.trim().toLowerCase();
            visibleIdeologies = allIdeologies.filter(name => {
                const text = [
                    name,
                    descriptions[name],
                    categoryOf[name] || '',
                    ...(mappingsOf[name] || [])
                ].join(' ').toLowerCase();
                return text.includes(query);
            });
            list.replaceChildren();
            if (!visibleIdeologies.length) {
                const empty = document.createElement('div');
                empty.id = 'empty';
                empty.textContent = 'No matching ideologies';
                list.append(empty);
                $('count').textContent = '0 ideologies';
                $('position').textContent = '0 / 0';
                $('category').textContent = '';
                $('ideology-name').textContent = 'No results';
                $('color-bar').style.background = '#444';
                $('description').textContent = '';
                $('mapping-count').textContent = '';
                $('mapping-list').replaceChildren();
                $('previous').disabled = true;
                $('next').disabled = true;
                return;
            }
            currentIndex = Math.max(0, visibleIdeologies.indexOf(selectedName));
            if (currentIndex < 0) currentIndex = 0;
            const groups = new Map();
            for (const name of visibleIdeologies) {
                const group = categoryOf[name] || 'Uncategorized';
                if (!groups.has(group)) groups.set(group, []);
                groups.get(group).push(name);
            }
            for (const [group, names] of groups) {
                const heading = document.createElement('div');
                heading.className = 'group-title';
                heading.textContent = `${group} · ${names.length}`;
                list.append(heading);
                for (const name of names) {
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.className = 'ideology-item';
                    button.classList.toggle('active', name === selectedName);
                    button.addEventListener('click', () => selectIdeology(name));
                    const dot = document.createElement('span');
                    dot.className = 'color-dot';
                    dot.style.background = labelColors[name] || '#5c5c5c';
                    const label = document.createElement('span');
                    label.className = 'item-name';
                    label.textContent = name;
                    button.append(dot, label);
                    list.append(button);
                }
            }
            $('count').textContent = `${visibleIdeologies.length} ideologies`;
            renderIdeology(selectedName && visibleIdeologies.includes(selectedName) ? selectedName : visibleIdeologies[0]);
        }
        let selectedName = allIdeologies[0] || '';
        function renderIdeology(name) {
            selectedName = name;
            currentIndex = visibleIdeologies.indexOf(name);
            const color = labelColors[name] || '#5c5c5c';
            $('category').textContent = categoryOf[name] || 'Uncategorized';
            $('ideology-name').textContent = name;
            $('ideology-name').style.color = color;
            $('color-bar').style.background = color;
            $('description').textContent = descriptions[name] || '';
            const isValue = categoryOf[name] === 'Values';
            $('value-icon').hidden = !isValue;
            $('value-icon').onerror = () => {
                $('value-icon').hidden = true;
            };
            if (isValue) {
                $('value-icon').src = iconPath(name);
            } else {
                $('value-icon').removeAttribute('src');
            }
            $('position').textContent = `${currentIndex + 1} / ${visibleIdeologies.length}`;
            $('previous').disabled = currentIndex <= 0;
            $('next').disabled = currentIndex >= visibleIdeologies.length - 1;
            const mappings = isValue ? [] : mappingsOf[name] || [];
            $('mapping-count').textContent = isValue ? '' : `(${mappings.length})`;
            const section = document.querySelector('#mapping-list').parentElement;
            section.hidden = isValue;
            const container = $('mapping-list');
            container.replaceChildren();
            for (const combination of mappings) {
                const item = document.createElement('div');
                item.className = 'mapping';
                const label = document.createElement('span');
                label.textContent = 'Combination';
                const values = document.createElement('div');
                values.className = 'combination-values';
                for (const value of combination.split('|')) {
                    const entry = document.createElement('button');
                    entry.type = 'button';
                    entry.className = 'combination-value';
                    entry.addEventListener('click', () => openValuePopup(value));
                    const icon = document.createElement('img');
                    icon.src = iconPath(value);
                    icon.alt = '';
                    icon.onerror = () => icon.remove();
                    const text = document.createElement('span');
                    text.textContent = value;
                    entry.append(icon, text);
                    values.append(entry);
                }
                item.append(label, values);
                container.append(item);
            }
            for (const button of list.querySelectorAll('.ideology-item')) {
                const active = button.querySelector('.item-name')?.textContent === name;
                button.classList.toggle('active', active);
                if (active) button.scrollIntoView({ block: 'nearest' });
            }
        }
        function selectIdeology(name) {
            if (!visibleIdeologies.includes(name)) return;
            renderIdeology(name);
        }
        function openValuePopup(name) {
            if (!Object.hasOwn(descriptions, name)) return;
            $('value-popup-category').textContent = categoryOf[name] || 'Values';
            $('value-popup-name').textContent = name;
            $('value-popup-name').style.color = labelColors[name] || '#5c5c5c';
            $('value-popup-description').textContent = descriptions[name] || 'No description available.';
            $('value-popup-icon').hidden = false;
            $('value-popup-icon').onerror = () => {
                $('value-popup-icon').hidden = true;
            };
            $('value-popup-icon').src = iconPath(name);
            $('value-popup').hidden = false;
            $('value-popup-close').focus();
        }
        function closeValuePopup() {
            $('value-popup').hidden = true;
        }
        $('value-popup-close').addEventListener('click', closeValuePopup);
        $('value-popup-backdrop').addEventListener('click', closeValuePopup);
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape' && !$('value-popup').hidden) {
                closeValuePopup();
            }
        });
        function navigate(direction) {
            if (!visibleIdeologies.length) return;
            const nextIndex = Math.max(0, Math.min(visibleIdeologies.length - 1, currentIndex + direction));
            selectIdeology(visibleIdeologies[nextIndex]);
        }
        $('previous').addEventListener('click', () => navigate(-1));
        $('next').addEventListener('click', () => navigate(1));
        search.addEventListener('input', renderList);
        document.addEventListener('keydown', event => {
            if (event.altKey || event.ctrlKey || event.metaKey) return;
            if (event.target.matches('input, textarea, select')) return;
            if (event.key === 'ArrowLeft') {
                event.preventDefault();
                navigate(-1);
            }
            if (event.key === 'ArrowRight') {
                event.preventDefault();
                navigate(1);
            }
        });
        if (typeof descriptions === 'undefined' || typeof labelColors === 'undefined' || typeof labelMapping === 'undefined' || typeof ideologyGroups === 'undefined') {
            document.body.innerHTML = '<pre style="color:white;padding:30px">Could not load the required data. Check that data.js is in the same directory and defines descriptions, labelColors, labelMapping, and ideologyGroups.</pre>';
        } else {
            renderList();
        }
    </script>
</body>

</html>
